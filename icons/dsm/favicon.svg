<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background rounded square (so it looks good as iOS home icon) -->
  <rect width="192" height="192" rx="36" fill="#1d6f42"/>
  
  <!-- Clipboard body (metal) -->
  <rect x="36" y="44" width="120" height="128" rx="6" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <rect x="36" y="44" width="120" height="128" rx="6" fill="url(#metalGrad)" opacity="0.6"/>
  
  <!-- Clip at top -->
  <rect x="72" y="28" width="48" height="22" rx="3" fill="#6b7280" stroke="#374151" stroke-width="2"/>
  <rect x="80" y="32" width="32" height="6" rx="2" fill="#374151"/>
  
  <!-- Paper on the clipboard -->
  <rect x="46" y="56" width="100" height="106" rx="2" fill="#fefefe" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Invoice header bar (green stripe) -->
  <rect x="46" y="56" width="100" height="14" fill="#1d6f42"/>
  <text x="51" y="67" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="white">INVOICE</text>
  
  <!-- Customer info lines (top) -->
  <rect x="52" y="76" width="60" height="2" fill="#9ca3af"/>
  <rect x="52" y="82" width="48" height="2" fill="#9ca3af"/>
  <rect x="52" y="88" width="55" height="2" fill="#9ca3af"/>
  
  <!-- Line item table header -->
  <line x1="52" y1="98" x2="140" y2="98" stroke="#374151" stroke-width="1"/>
  
  <!-- Line items (4 rows with item + price) -->
  <rect x="52" y="103" width="50" height="2" fill="#6b7280"/>
  <rect x="126" y="103" width="14" height="2" fill="#6b7280"/>
  
  <rect x="52" y="111" width="55" height="2" fill="#6b7280"/>
  <rect x="126" y="111" width="14" height="2" fill="#6b7280"/>
  
  <rect x="52" y="119" width="48" height="2" fill="#6b7280"/>
  <rect x="126" y="119" width="14" height="2" fill="#6b7280"/>
  
  <rect x="52" y="127" width="52" height="2" fill="#6b7280"/>
  <rect x="126" y="127" width="14" height="2" fill="#6b7280"/>
  
  <!-- Total separator -->
  <line x1="100" y1="138" x2="140" y2="138" stroke="#374151" stroke-width="1.5"/>
  
  <!-- Total -->
  <rect x="100" y="143" width="26" height="3" fill="#1d6f42"/>
  <rect x="128" y="143" width="14" height="3" fill="#1d6f42"/>
  
  <!-- Signature line at bottom -->
  <line x1="56" y1="156" x2="100" y2="156" stroke="#9ca3af" stroke-width="1"/>
  
  <!-- Metal gradient definition -->
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
</svg>
